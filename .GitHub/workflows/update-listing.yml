name: Actualizar listado de concursos

on:
  schedule:
    # Todos los días a las 09:00 UTC (~06:00 en Paraguay la mayor parte del año)
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-listing:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencia de parseo (cheerio)
        run: npm install cheerio

      - name: Generar data/listado.json
        run: node scripts/update-listing.mjs

      - name: Publicar cambios si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listado.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el listado."
          else
            git commit -m "Actualizar listado de concursos"
            git push
          fi
